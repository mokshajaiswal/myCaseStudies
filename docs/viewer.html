<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Research work by Moksha Jaiswal">
  <title>Research Viewer · Moksha Jaiswal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="viewer-page">
  <header class="viewer-header">
    <a class="back-link" href="./" aria-label="Back to research library">← All research</a>
    <div class="viewer-title">
      <p class="eyebrow" id="viewer-kind">Research document</p>
      <h1 id="viewer-name">Loading…</h1>

    <a class="open-link" id="open-original" href="#" target="_blank" rel="noreferrer">Open original ↗</a>
  </header>
  <main class="viewer-shell" id="viewer-shell" aria-live="polite"></main>
  <script src="app.js"></script>
</body>
</html>
