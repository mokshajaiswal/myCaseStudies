    <a class="skip-link" href="#case-study">Skip to case study</a>

        <div class="hero-copy">
          <img class="hero__illustration" src="assets/hero/logo.webp" width="96" height="96" alt="Traces logo" decoding="async" fetchpriority="high" />

          <p id="hero-summary"></p>

        <img class="hero-icons" src="assets/hero/trace-icons.svg?v=2" width="150" height="56" alt="" aria-hidden="true" />

      </div>
