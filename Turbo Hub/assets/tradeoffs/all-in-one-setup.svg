<svg xmlns="http://www.w3.org/2000/svg" width="280" height="520" viewBox="0 0 280 520" role="img"><title>Create a family Hub</title><defs><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#1975eb"/><stop offset="1" stop-color="#7671ed"/></linearGradient></defs><rect x="1" y="1" width="278" height="518" rx="32" fill="#fff" stroke="#d9dfec" stroke-width="2"/><g font-family="Inter,Arial,sans-serif"><path d="M33 2H247Q278 2 278 33V100H2V33Q2 2 33 2" fill="url(#blue)"/><rect x="104" y="12" width="72" height="5" rx="2.5" fill="#fff" opacity=".7"/><text x="140" y="59" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Create a family Hub</text><path d="M2 107Q2 85 24 85H256Q278 85 278 107V486H2Z" fill="#fff"/><text x="22" y="115" font-size="15" fill="#34383f" font-weight="600">Hub details</text><text x="22" y="135" font-size="10" fill="#536076">Hub name</text><rect x="22" y="142" width="236" height="28" rx="7" fill="#fbfcfe" stroke="#d9dfec"/><text x="32" y="160" font-size="11" fill="#536076">The Sharma’s</text><text x="22" y="183" font-size="10" fill="#536076">Funding account</text><rect x="22" y="190" width="236" height="28" rx="7" fill="#fbfcfe" stroke="#d9dfec"/><text x="32" y="208" font-size="11" fill="#536076">Select an account</text><text x="22" y="231" font-size="10" fill="#536076">Family members</text><rect x="22" y="238" width="236" height="28" rx="7" fill="#fbfcfe" stroke="#d9dfec"/><text x="32" y="256" font-size="11" fill="#536076">Add names &amp; mobile numbers</text><text x="22" y="279" font-size="10" fill="#536076">Roles &amp; permissions</text><rect x="22" y="286" width="236" height="28" rx="7" fill="#fbfcfe" stroke="#d9dfec"/><text x="32" y="304" font-size="11" fill="#536076">Choose who can manage</text><text x="22" y="327" font-size="10" fill="#536076">Monthly limits</text><rect x="22" y="334" width="236" height="28" rx="7" fill="#fbfcfe" stroke="#d9dfec"/><text x="32" y="352" font-size="11" fill="#536076">Set an amount for each member</text><text x="22" y="375" font-size="10" fill="#536076">Payment methods</text><rect x="22" y="382" width="236" height="28" rx="7" fill="#fbfcfe" stroke="#d9dfec"/><text x="32" y="400" font-size="11" fill="#536076">Choose cards &amp; UPI</text><rect x="22" y="455" width="236" height="32" rx="9" fill="#356cdf"/><text x="140" y="476" font-size="12" fill="white" text-anchor="middle" font-weight="600">Create Hub</text><rect x="100" y="505" width="80" height="4" rx="2" fill="#34383f"/></g></svg>