<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PayZapp · Welcome</title>
  <script src="../shared/ds.js" data-assets="tokens.css components/hub.css components/chrome-backdrop.css icons/phosphor.js icons/turbo-icons.js components/hub.js components/chrome-backdrop.js"></script>
  <link rel="stylesheet" href="onboarding.css">
  <script src="onboarding.js" defer></script>
<script src="../../flow-story-data.js"></script>
  <script src="../shared/story-context.js"></script>
</head>
<body>
  <div class="viewport">
    <main class="walkthrough is-splash" aria-label="Welcome to PayZapp">
      <div id="statusbar"></div>
      <section class="splash" aria-label="PayZapp splash screen">
        <img src="../play-store/assets/payzapp-icon.png" width="112" height="112" alt="PayZapp">
      </section>
      <div class="carousel-area" inert aria-hidden="true">
      <div class="carousel-content">
      <section class="slides" aria-roledescription="carousel" aria-label="Discover PayZapp" aria-live="off">
        <article class="slide" role="group" aria-roledescription="slide" aria-label="1 of 3: An Umbrella of Payments">
          <div class="art art--payments"><img src="assets/payments.png" alt="An umbrella, payment terminal and phone" width="800" height="1422" draggable="false"></div>
          <div class="copy"><h1>An Umbrella of Payments</h1><p>Pay your bills, recharge, shop &amp; more!</p></div>
        </article>
        <article class="slide" role="group" aria-roledescription="slide" aria-label="2 of 3: Smart Statements" inert aria-hidden="true">
          <div class="art art--statements"><img src="assets/statements.png" alt="A phone, calendar and statement" draggable="false"></div>
          <div class="copy"><h2>Smart Statements</h2><p>Get access to smarter statements and manage your money better!</p></div>
        </article>
        <article class="slide" role="group" aria-roledescription="slide" aria-label="3 of 3: PayZapp Rewards" inert aria-hidden="true">
          <div class="art art--rewards"><img src="assets/rewards.png" alt="A phone with rewards, a gift and gold coins" draggable="false"></div>
          <div class="copy"><h2>PayZapp Rewards</h2><p>Get attractive cashback and rewards while making payments, referring friends and more!</p></div>
        </article>
      </section>
      <nav class="pagination" aria-label="Choose onboarding screen">
        <button type="button" data-slide="0" aria-label="An Umbrella of Payments" aria-current="step"><span></span></button>
        <button type="button" data-slide="1" aria-label="Smart Statements"><span></span></button>
        <button type="button" data-slide="2" aria-label="PayZapp Rewards"><span></span></button>
      </nav>
      </div>
      </div>
      <div class="start-action" id="start-action" inert aria-hidden="true"></div>
      <p class="sr-only" id="announcement" aria-live="polite"></p>
    </main>
  </div>
</body>
</html>
