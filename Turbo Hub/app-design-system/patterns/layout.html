<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layout wireframe</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.5 system-ui;color:#4b5563;background:#f5f6f8}main{display:flex;justify-content:center;gap:32px;align-items:center;flex-wrap:wrap}.frame{width:280px;height:420px;border:1px solid #aab2bd;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:#dce2eb}.chrome{padding:18px;text-align:center;flex:none}.content{position:relative;flex:1;min-height:0;border-radius:20px 20px 0 0;background:white;display:grid}.scroll{grid-area:1/1;overflow:auto;padding:20px 20px 112px;overscroll-behavior:none}.block{height:54px;background:#edf0f4;border:1px dashed #c4cad3;border-radius:8px;margin:0 0 16px;display:grid;place-items:center}.footer{grid-area:1/1;align-self:end;position:relative;padding:16px 20px;background:#ffffffbb;backdrop-filter:blur(12px)}.footer:before{content:"";position:absolute;inset:-20px 0 100%;background:linear-gradient(transparent,#ffffffbb)}.action{height:42px;display:grid;place-items:center;background:#d6dce5;border:1px solid #aab2bd;border-radius:8px}.safe{height:16px;background:white;flex:none}aside{max-width:290px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px}body[data-kind=rounded] .footer{display:none}body[data-kind=rounded] .scroll{padding-bottom:20px}
</style></head><body><main><section class="frame" aria-label="Layout wireframe"><div class="chrome">Continuous header backdrop</div><div class="content"><div class="scroll" tabindex="0" role="region" aria-label="Scrollable wireframe content"><div class="block">Content block</div><div class="block">Content block</div><div class="block">Content block</div><div class="block">Content block</div><div class="block">Content block</div><div class="block">Last content block</div></div><div class="footer"><div class="action">Action placeholder</div></div></div><div class="safe"></div></section><aside><h1 id="title"></h1><p id="description"></p><p>Gray blocks represent content and controls. Scroll inside the frame to explore the layout.</p></aside></main><script>
