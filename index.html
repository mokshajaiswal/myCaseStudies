<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Turbo Hub case study: one shared place for family money in PayZapp."
    />
    <title>Turbo Hub | Product Case Study</title>
    <link rel="preload" as="image" href="assets/bg.webp" type="image/webp" />
    <link
      rel="preload"
      as="image"
      href="assets/phone case clean.png"
      type="image/png"
    />
    <link rel="stylesheet" href="styles.css?v=flow-highlight-horizontal-1" />
    <script src="script.js?v=flow-highlight-horizontal-1" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#case-study">Skip to case study</a>

    <div
      class="scroll-progress"
      role="progressbar"
      aria-label="Page scroll progress"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <span class="scroll-progress-fill" aria-hidden="true"></span>
      <span class="scroll-progress-value" aria-hidden="true">0%</span>
    </div>

    <main id="case-study">
      <section class="hero" id="top" aria-labelledby="hero-title">
        <div class="hero-copy">
          <div class="asset-placeholder asset-placeholder--hero" aria-hidden="true"></div>
          <h1 id="hero-title"></h1>
          <p id="hero-summary"></p>
        </div>
      </section>

      <div id="dynamic-content"></div>
    </main>

    <template id="media-placeholder-template">
      <div class="media-placeholder"></div>
    </template>
  </body>
</html>
